<title>Clip Ops Board</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#141416; --card:#1f1f23; --card2:#2a2a30; --line:#35353c;
  --ink:#f4f4f1; --ink2:#b9b9c1; --ink3:#8b8b94;
  --accent:#ffd100; --on-accent:#141416; --accent-soft:rgba(255,209,0,.13);
  --ok:#3dd68c; --ok-soft:rgba(61,214,140,.15); --warn:#f5b83d; --warn-soft:rgba(245,184,61,.16);
  --r:16px; color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f3f3ef; --card:#ffffff; --card2:#eeeeea; --line:#deded9;
    --ink:#17171a; --ink2:#4f4f58; --ink3:#7b7b84;
    --accent:#f2c200; --on-accent:#141416; --accent-soft:rgba(242,194,0,.16);
    --ok:#10804c; --ok-soft:rgba(16,128,76,.12); --warn:#9a6700; --warn-soft:rgba(154,103,0,.12);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f3f3ef; --card:#ffffff; --card2:#eeeeea; --line:#deded9;
  --ink:#17171a; --ink2:#4f4f58; --ink3:#7b7b84;
  --accent:#f2c200; --on-accent:#141416; --accent-soft:rgba(242,194,0,.16);
  --ok:#10804c; --ok-soft:rgba(16,128,76,.12); --warn:#9a6700; --warn-soft:rgba(154,103,0,.12);
  color-scheme:light;
}
:root[data-theme="dark"]{ color-scheme:dark; }
*{box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font:400 16px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",sans-serif;
  max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 56px;}
a{color:inherit;}
button{font:inherit;cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
[hidden]{display:none !important;}

header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;}
.brand{font-family:"Archivo Black",Archivo,sans-serif;font-size:1.1rem;white-space:nowrap;}
.brand i{font-style:normal;color:var(--accent);}
.stamp{display:flex;align-items:center;gap:6px;color:var(--ink3);font-size:.78rem;text-align:right;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:none;}
.dot.live{background:var(--ok);}

section{margin-top:28px;}
h2{margin:0 0 10px;font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);
  display:flex;justify-content:space-between;align-items:baseline;}
h2 span{letter-spacing:0;text-transform:none;font-weight:600;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 18px;border-radius:12px;
  border:0;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.95rem;text-decoration:none;white-space:nowrap;}
.btn.alt{background:var(--card2);color:var(--ink);}
.btn.link{background:transparent;color:var(--ink2);padding:0 6px;min-height:40px;font-weight:600;}
.btn.small{min-height:38px;padding:0 12px;font-size:.85rem;border-radius:10px;}
.btn:disabled{opacity:.5;cursor:default;}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
.muted{color:var(--ink2);}
.hint{color:var(--ink3);font-size:.85rem;margin:0;}

/* next up */
.hero{background:var(--card);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px;
  box-shadow:inset 0 3px 0 var(--accent);}
.hero .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);}
.hero h3{margin:0;font-size:1.3rem;line-height:1.25;text-wrap:balance;}
.hero p{margin:0;color:var(--ink2);}
.hero .tip{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:.9rem;}
.cap{background:var(--card2);border-radius:10px;padding:10px 12px;font:500 .82rem/1.5 "IBM Plex Mono",ui-monospace,monospace;
  white-space:pre-wrap;word-break:break-word;}
.subs{display:flex;flex-direction:column;gap:10px;}
.sub{background:var(--card2);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.sub b{font-weight:700;}
.sub .btn.alt{background:var(--card);}
input[type=url],input[type=text]{flex:1 1 200px;min-width:0;min-height:46px;background:var(--card2);border:1px solid var(--line);
  color:var(--ink);border-radius:12px;padding:0 12px;font:inherit;font-size:.95rem;}
.steps{margin:0;padding-left:20px;color:var(--ink2);font-size:.9rem;display:flex;flex-direction:column;gap:6px;}

/* list rows */
.list{background:var(--card);border-radius:var(--r);overflow:hidden;}
.item{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;background:transparent;border:0;color:var(--ink);
  text-align:left;border-top:1px solid var(--line);}
.item:first-child{border-top:0;}
.item .main{flex:1;min-width:0;}
.item .t{display:block;font-weight:600;line-height:1.3;}
.item .s{display:block;color:var(--ink3);font-size:.82rem;margin-top:2px;}
.item .go{color:var(--ink3);font-size:1.1rem;flex:none;}
.n{width:26px;height:26px;border-radius:50%;background:var(--card2);color:var(--ink2);font-size:.8rem;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex:none;}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
.pill{font-size:.72rem;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--card2);color:var(--ink3);white-space:nowrap;}
.pill.done{background:var(--ok-soft);color:var(--ok);}
.pill.draft{background:var(--warn-soft);color:var(--warn);}
.pill.todo{background:var(--accent-soft);color:var(--ink);}

/* money */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.tile{background:var(--card);border-radius:var(--r);padding:14px;}
.tile .k{font:500 1.2rem/1.2 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
.tile .l{color:var(--ink3);font-size:.75rem;margin-top:4px;}
.bar{height:6px;border-radius:3px;background:var(--card2);overflow:hidden;margin-top:8px;}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;}

details.more{background:var(--card);border-radius:var(--r);margin-top:8px;}
details.more > summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:600;color:var(--ink2);}
details.more > summary::-webkit-details-marker{display:none;}
details.more > summary::after{content:"＋";float:right;color:var(--ink3);}
details.more[open] > summary::after{content:"－";}
details.more .inner{padding:0 16px 16px;display:flex;flex-direction:column;gap:12px;}

footer{margin-top:32px;color:var(--ink3);font-size:.8rem;line-height:1.6;}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);opacity:0;
  pointer-events:none;background:var(--card2);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:12px 16px;
  font-size:.9rem;max-width:90vw;z-index:9;transition:transform .25s,opacity .25s;}
#toast.show{transform:translate(-50%,0);opacity:1;}
@media (prefers-reduced-motion: reduce){#toast{transition:none;}}
@media (max-width:380px){.tiles{grid-template-columns:1fr 1fr;} .tiles .tile:last-child{grid-column:1 / -1;}}
</style>

<header>
  <div class="brand">CHAT, CL<i>&#9654;</i>P THAT</div>
  <div class="stamp"><span class="dot" id="dot"></span><span id="stamp">loading…</span></div>
</header>

<section id="s-next"></section>
<section id="s-after"></section>
<section id="s-clips"></section>
<section id="s-money"></section>
<section id="s-camps"></section>
<section id="s-later"></section>

<footer>Stats and new campaigns refresh at 9am and 6pm ET. When a clip is ready you get a phone alert, a TikTok draft to OK and a private YouTube draft. Nothing goes public without you.</footer>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
// Offline copy only (outside claude.ai). The live database replaces it.
const FB = {
  board: {stamp: "2026-09-27", tasks: [{id: "twitch-app", text: "Create the Twitch developer app"}]},
  youtube: {}, posts: [{id: "v003", views: 908, pays_from: 2000, payable: false, accruing: 0.91}],
  campaigns: [{id: "coinbase-valorant-oneshot", name: "Coinbase × Valorant", rate: "$1.00/1k", rem: 9155, bud: 10000, flag: "ok",
    can_queue: true, platforms: ["tiktok", "instagram", "youtube"], whop_name: "COINBASE x VALORANT - CLIPPING"}],
  queue: [{id: "q-val-1v1-v9", title: "Insane 1v1 shot", campaign_id: "coinbase-valorant-oneshot", status: "posted", ledger_id: "v003",
    allowed: ["tiktok", "instagram", "youtube"], platforms: {tiktok: {status: "submitted"}},
    package: {caption_ig: "#ad #coinbasepartner the 1v1s for a shot at 1 BTC are getting out of hand @coinbase #valorant #esports"}}]
};

const PLAT = {tiktok: "TikTok", youtube: "YouTube", instagram: "Instagram"};
const ORDER = ["tiktok", "youtube", "instagram"];
const WHOP = "https://whop.com/discover/content-rewards/";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = (n) => Number(n || 0).toLocaleString();
const usd = (n) => "$" + Number(n || 0).toLocaleString(undefined, {maximumFractionDigits: 0});
const clock = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : d.toLocaleTimeString([], {hour: "numeric", minute: "2-digit"}); };

let S = {board: FB.board, youtube: FB.youtube, campaigns: FB.campaigns, queue: FB.queue, posts: FB.posts};
const UI = {focus: null, skipped: [], open: {}, text: {}, confirm: {}, finished: false, queueing: null};
let db = null, dls = null, pendingRender = false;

// ---------- model ----------
const campOf = (q) => S.campaigns.find(c => c.id === q.campaign_id) || {};
const postOf = (q) => S.posts.find(p => p.id === q.ledger_id) || null;
const alive = (q) => campOf(q).flag !== "dead";
const titleOf = (q) => q.title || q.campaign_name || "Clip";
const allowedOf = (q) => (q.allowed || campOf(q).platforms || ["tiktok"]).filter(p => PLAT[p]);
const pstat = (q, p) => ((q.platforms || {})[p] || {}).status || "none";
const pk = (q) => q.package || {};
// Each campaign's own Content Rewards page (Join / Submit live there). Whop's generic
// content-rewards URL only shows the app's store page, so it's a last resort.
const campLink = (q) => { const c = campOf(q); return c.submit_link || (c.cr_campaign_id ? "https://contentrewards.com/discover/" + c.cr_campaign_id : ""); };
const whopName = (q) => campOf(q).whop_name || campOf(q).name || q.campaign_name || "";
const videoUrl = (q) => (pk(q).tiktok_draft || {}).video_url || ((q.drafts || {}).tiktok || {}).video_url || "";
function captionFor(q, p){
  if (p === "instagram") return pk(q).caption_ig || pk(q).caption || "";
  if (p === "youtube") return pk(q).yt_title || pk(q).caption || "";
  return pk(q).caption || "";
}
function draftOf(q, p){
  const d = (q.drafts || {})[p];
  if (d && d.status) return d;
  const l = p === "tiktok" ? pk(q).tiktok_draft : null;  // drafts staged before the board tracked them
  if (l && l.status === "awaiting_approval") return {status: "awaiting_approval", expires_at: l.expires_at};
  if (l && ["check_inbox", "SEND_TO_USER_INBOX"].includes(l.status)) return {status: "in_inbox"};
  return null;
}
const approvalFirst = (q) => campOf(q).post_flow === "submit_first";
const approvalOf = (q) => (q.approval || {}).status || "none";   // none | pending | approved | rejected
const anyPosted = (q) => allowedOf(q).some(p => pstat(q, p) !== "none");
const formLive = (d) => !!(d && d.status === "awaiting_approval" && d.expires_at && Date.parse(d.expires_at) > Date.now());
const maybeInbox = (d) => !!(d && (["in_inbox", "check_inbox"].includes(d.status) || d.status === "awaiting_approval"));
const active = () => S.queue.filter(q => ["ready", "posted"].includes(q.status) && alive(q) && !q.skip_submit);
const finishedClip = (q) => q.status === "posted" && (q.skip_submit || !alive(q) ||
  allowedOf(q).every(p => ["submitted", "skipped"].includes(pstat(q, p))));

// Every remaining step, most urgent first: TikTok forms that expire, links to submit,
// private YouTube drafts to make public, then posts. One step shows at a time.
function allSteps(){
  const out = [], subs = [];
  const clips = active().filter(q => !finishedClip(q)).sort((a, b) => (a.created || 0) - (b.created || 0));
  for (const q of clips){
    if (approvalFirst(q) && approvalOf(q) !== "approved"){
      // Nothing more gets posted until the campaign approves it. A link that's already up still gets submitted.
      const posted = allowedOf(q).filter(p => pstat(q, p) === "posted");
      posted.forEach(p => subs.push({q, p}));
      const left = allowedOf(q).some(p => pstat(q, p) === "none");
      const asked = approvalOf(q) === "pending" || allowedOf(q).some(p => pstat(q, p) === "submitted");
      if (left && !posted.length) out.push(asked ? {key: "wait:" + q.id, kind: "wait", q, prio: 5}
                                                 : {key: "approve:" + q.id, kind: "approve", q, prio: 0});
      continue;
    }
    for (const p of ORDER){
      if (!allowedOf(q).includes(p)) continue;
      const st = pstat(q, p);
      if (st === "submitted" || st === "skipped") continue;
      if (st === "posted") { subs.push({q, p}); continue; }
      const d = draftOf(q, p);
      if (p === "tiktok" && formLive(d)) out.push({key: "form:" + q.id, kind: "form", q, p, d, prio: 0});
      else if (p === "youtube" && d && d.status === "uploaded") out.push({key: "yt:" + q.id, kind: "yt", q, p, d, prio: 2});
      else out.push({key: "post:" + q.id + ":" + p, kind: "post", q, p, d, prio: 3});
    }
  }
  if (subs.length) out.push({key: "submit", kind: "submit", items: subs, prio: 1});
  for (const m of (S.board.tasks || []).filter(t => !t.done)) out.push({key: "task:" + m.id, kind: "task", m, prio: 4});
  return out.map((s, i) => ({s, i})).sort((a, b) => a.s.prio - b.s.prio || a.i - b.i).map(x => x.s);
}
function label(s){
  if (s.kind === "approve") return `Get it approved before posting: ${titleOf(s.q)}`;
  if (s.kind === "wait") return `Waiting for approval: ${titleOf(s.q)}`;
  if (s.kind === "form") return `OK the TikTok draft: ${titleOf(s.q)}`;
  if (s.kind === "yt") return `Make it public on YouTube: ${titleOf(s.q)}`;
  if (s.kind === "post") return `Post on ${PLAT[s.p]}: ${titleOf(s.q)}`;
  if (s.kind === "submit") return `Submit ${s.items.length} link${s.items.length > 1 ? "s" : ""} on Whop`;
  return s.m.text;
}

// ---------- helpers ----------
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3200); }
async function copy(txt, btn){
  let ok = true;
  try { await navigator.clipboard.writeText(txt); }
  catch (e) {
    ok = false;
    const ta = document.createElement("textarea"); ta.value = txt; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch (e2) {}
    ta.remove();
  }
  if (btn) { const old = btn.textContent; btn.textContent = ok ? "Copied ✓" : "Select and copy"; setTimeout(() => { btn.textContent = old; }, 1500); }
}
let writing = false;
async function write(fn, okMsg){
  if (!db) { toast("Open the board on claude.ai to save changes."); return false; }
  if (writing) return false;
  writing = true;
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast("Couldn't save. Check your connection and try again."); return false; }
  finally { writing = false; }
}
const qdoc = (id) => db.collection("queue").doc(id);

// ---------- views ----------
function videoButtons(q){
  const b = [];
  if (dls && (q.clip || {}).asset_url) b.push(`<button class="btn alt" data-dl="${esc(q.id)}">Download video</button>`);
  else if (videoUrl(q)) b.push(`<a class="btn alt" href="${esc(videoUrl(q))}" target="_blank" rel="noopener">Open video ↗</a>`);
  return b.join("");
}
function postedForm(q, p, placeholder){
  const k = q.id + ":" + p;
  if (!UI.open[k]) return `<button class="btn" data-openpost="${esc(k)}">I posted it</button>`;
  return `<div class="row" style="width:100%">
    <input type="url" data-text="${esc(k)}" placeholder="${esc(placeholder)}" value="${esc(UI.text[k] || "")}">
    <button class="btn" data-savepost="${esc(k)}">Save</button></div>
    <p class="hint">Paste the post's link (Share → Copy link). You'll need it for Whop.</p>`;
}

function hero(s){
  if (!s) return `<div class="hero"><div class="eyebrow">All done</div><h3>Nothing to do right now.</h3>
    <p>New clips land here when they're ready, and your phone buzzes.</p></div>`;
  const eb = `<div class="eyebrow">Next up</div>`;
  if (s.kind === "approve" || s.kind === "wait"){
    const q = s.q, page = campLink(q) || WHOP;
    if (s.kind === "wait") return `<div class="hero">${eb}<h3>Waiting for approval: “${esc(titleOf(q))}”</h3>
      <p>Don't post it ${anyPosted(q) ? "anywhere else " : ""}yet. Check the campaign page for their answer.</p>
      <div class="row"><a class="btn alt" href="${esc(page)}" target="_blank" rel="noopener">Open campaign ↗</a>
        <button class="btn" data-approval="${esc(q.id)}:approved">It's approved</button>
        <button class="btn link" data-approval="${esc(q.id)}:rejected">It was rejected</button></div></div>`;
    return `<div class="hero">${eb}<h3>Get “${esc(titleOf(q))}” approved before posting</h3>
      <p>This campaign wants the <b>video submitted first</b>. Post it only after they approve it.</p>
      <div class="tip">Save the video → open the campaign → Submit → upload the video.</div>
      <div class="row">${videoButtons(q)}<a class="btn" href="${esc(page)}" target="_blank" rel="noopener">Open campaign ↗</a></div>
      <div class="row"><button class="btn alt" data-approval="${esc(q.id)}:pending">I sent it for approval</button></div></div>`;
  }
  if (s.kind === "form"){
    return `<div class="hero">${eb}<h3>OK the TikTok draft for “${esc(titleOf(s.q))}”</h3>
      <p>The TikTok form is in your Claude chat, open until <b>${esc(clock(s.d.expires_at))}</b>. After you OK it, the video waits in TikTok → Inbox → System notifications.</p>
      <div class="row">${s.d.session_url ? `<a class="btn" href="${esc(s.d.session_url)}" target="_blank" rel="noopener">Open the form ↗</a>` : ""}
        <button class="btn alt" data-okd="${esc(s.q.id)}">I OK'd it</button></div></div>`;
  }
  if (s.kind === "yt"){
    return `<div class="hero">${eb}<h3>Make “${esc(titleOf(s.q))}” public on YouTube</h3>
      <p>It's already on your channel as a private draft.</p>
      <div class="tip">In YouTube Studio: tick <b>Includes paid promotion</b>${tipFor(s.q, "youtube")}, then set it to <b>Public</b>.</div>
      <div class="row"><a class="btn" href="${esc(s.d.studio_url || "https://studio.youtube.com/")}" target="_blank" rel="noopener">Open YouTube Studio ↗</a>
        <button class="btn alt" data-ytpublic="${esc(s.q.id)}">It's public now</button></div></div>`;
  }
  if (s.kind === "post"){
    const q = s.q, p = s.p, cap = captionFor(q, p), tips = (pk(q).tips || {})[p];
    const when = p === "tiktok" && pk(q).window ? pk(q).window : "";
    const inbox = p === "tiktok" && maybeInbox(s.d);
    return `<div class="hero">${eb}<h3>Post “${esc(titleOf(q))}” on ${esc(PLAT[p])}</h3>
      ${when ? `<p><b>When:</b> ${esc(when)}</p>` : ""}
      ${inbox ? `<p>It should be waiting in TikTok → Inbox → System notifications. Not there? Use the video below.</p>` : ""}
      ${cap ? `<div class="cap">${esc(cap)}</div>` : ""}
      ${p === "youtube" && pk(q).yt_description ? `<div class="cap">${esc(pk(q).yt_description)}</div>` : ""}
      <div class="row">${cap ? `<button class="btn alt" data-copy="${esc(q.id + ":" + p)}">${p === "youtube" ? "Copy title" : "Copy caption"}</button>` : ""}
        ${p === "youtube" && pk(q).yt_description ? `<button class="btn alt" data-copydesc="${esc(q.id)}">Copy description</button>` : ""}
        ${videoButtons(q)}</div>
      ${tips ? `<div class="tip">${esc(tips)}</div>` : ""}
      <div class="row">${postedForm(q, p, `Paste the ${PLAT[p]} link`)}</div></div>`;
  }
  if (s.kind === "submit"){
    return `<div class="hero">${eb}<h3>Submit ${s.items.length > 1 ? s.items.length + " links" : "your link"} on Whop</h3>
      <p>Open the campaign page (sign in with Whop if it asks) → <b>Submit</b> → paste the link. Add the video file if it asks. Each platform is submitted separately.</p>
      <div class="subs">${s.items.map(({q, p}) => {
        const url = ((q.platforms || {})[p] || {}).url || "", link = campLink(q);
        return `<div class="sub"><div><b>${esc(titleOf(q))}</b> · ${esc(PLAT[p])}</div>
          <div class="hint">Campaign: <b>${esc(whopName(q))}</b></div>
          <div class="row">${link ? `<a class="btn small" href="${esc(link)}" target="_blank" rel="noopener">Open campaign ↗</a>`
              : `<a class="btn small" href="${WHOP}" target="_blank" rel="noopener">Open Whop ↗</a>`}
            ${url ? `<button class="btn alt small" data-copylink="${esc(q.id + ":" + p)}">Copy link</button>` : ""}
            ${videoButtons(q).replace(/class="btn alt"/g, 'class="btn alt small"')}
            <button class="btn alt small" data-submitted="${esc(q.id + ":" + p)}">Done, I submitted it</button></div></div>`;
      }).join("")}</div></div>`;
  }
  const m = s.m, st = m.steps || twitchSteps(m.id);
  return `<div class="hero">${eb}<h3>${esc(m.text)}</h3>${m.sub ? `<p>${esc(m.sub)}</p>` : ""}
    ${st.length ? `<ol class="steps">${st.map(x => `<li>${esc(x)}</li>`).join("")}</ol>` : ""}
    <div class="row"><button class="btn" data-done="${esc(m.id)}">Done</button></div></div>`;
}
function tipFor(q, p){ const t = (pk(q).tips || {})[p]; return t ? ` (${esc(t)})` : ""; }
function twitchSteps(id){
  if (id !== "twitch-app") return [];
  const ms = ((S.youtube || {}).longform || {}).milestones || [];
  return (ms.find(x => x.id === "twitch") || {}).steps || [];
}

function renderNext(){
  const all = allSteps();
  let steps = all.filter(s => !UI.skipped.includes(s.key));
  if (!steps.length && all.length) { UI.skipped = []; steps = all; }
  const cur = steps.find(s => s.key === UI.focus) || steps[0] || null;
  const rest = steps.filter(s => s !== cur);
  $("s-next").innerHTML = `${hero(cur)}
    ${cur && rest.length ? `<div class="row" style="justify-content:flex-end;margin-top:6px"><button class="btn link" data-skip="${esc(cur.key)}">Skip for now</button></div>` : ""}`;
  $("s-after").innerHTML = rest.length ? `<h2>After that <span>${rest.length} more</span></h2>
    <div class="list">${rest.slice(0, 4).map((s, i) => `<button class="item" data-focus="${esc(s.key)}">
      <span class="n">${i + 2}</span><span class="main"><span class="t">${esc(label(s))}</span></span><span class="go">›</span></button>`).join("")}
      ${rest.length > 4 ? `<div class="item"><span class="main s">+ ${rest.length - 4} more after these</span></div>` : ""}</div>` : "";
}

function pill(q, p){
  const st = pstat(q, p), d = draftOf(q, p);
  if (st === "none" && approvalFirst(q) && approvalOf(q) !== "approved") return `<span class="pill draft">${PLAT[p]} · needs approval</span>`;
  if (st === "submitted") return `<span class="pill done">${PLAT[p]} ✓</span>`;
  if (st === "skipped") return `<span class="pill">${PLAT[p]} skipped</span>`;
  if (st === "posted") return `<span class="pill todo">${PLAT[p]} · submit</span>`;
  if (d && (d.status === "uploaded" || formLive(d) || ["in_inbox", "check_inbox"].includes(d.status))) return `<span class="pill draft">${PLAT[p]} · draft</span>`;
  return `<span class="pill">${PLAT[p]} –</span>`;
}
function renderClips(){
  const act = active().filter(q => !finishedClip(q)).sort((a, b) => (b.created || 0) - (a.created || 0));
  const fin = S.queue.filter(q => q.status === "posted" && finishedClip(q));
  const mk = S.queue.filter(q => ["queued", "producing"].includes(q.status));
  const row = (q) => {
    const p = postOf(q), c = campOf(q);
    const meta = [c.short || c.name || q.campaign_name, p ? num(p.views) + " views" : ""].filter(Boolean).join(" · ");
    return `<button class="item" data-clip="${esc(q.id)}"><span class="main"><span class="t">${esc(titleOf(q))}</span>
      <span class="s">${esc(meta)}</span><span class="pills">${allowedOf(q).map(pl => pill(q, pl)).join("")}</span></span><span class="go">›</span></button>`;
  };
  $("s-clips").innerHTML = `<h2>Your clips <span>${act.length} in progress</span></h2>
    <div class="list">${act.length ? act.map(row).join("") : `<div class="item"><span class="main muted">No clips in progress. Make one from Campaigns below.</span></div>`}
      ${mk.map(q => `<div class="item"><span class="main"><span class="t">${esc(q.campaign_name || "New clip")}</span>
        <span class="s">${q.status === "producing" ? "Being made now" : "Waiting for the agent (runs hourly, 9am–11pm ET)"}</span></span>
        <button class="btn link" data-cancel="${esc(q.id)}">${UI.confirm[q.id] ? "Tap to confirm" : "Cancel"}</button></div>`).join("")}</div>
    ${fin.length ? `<details class="more"${UI.finished ? " open" : ""} data-fin="1"><summary>Finished (${fin.length})</summary><div class="inner">
      ${fin.map(q => { const u = ((q.platforms || {}).tiktok || {}).url;
        return `<div class="row" style="justify-content:space-between"><span>${esc(titleOf(q))}<span class="hint"> · ${esc(q.skip_reason || "done")}</span></span>
        ${u ? `<a class="btn link" href="${esc(u)}" target="_blank" rel="noopener">View ↗</a>` : ""}</div>`; }).join("")}</div></details>` : ""}`;
}

function renderMoney(){
  const posts = S.posts || [];
  const views = posts.reduce((a, p) => a + (p.views || 0), 0);
  const earned = posts.filter(p => p.payable).reduce((a, p) => a + (p.accruing || 0), 0);
  const next = S.queue.filter(q => q.status === "posted" && alive(q) && !q.skip_submit).map(q => ({q, p: postOf(q)}))
    .filter(x => x.p && x.p.pays_from && !x.p.payable).sort((a, b) => b.p.views / b.p.pays_from - a.p.views / a.p.pays_from)[0];
  $("s-money").innerHTML = `<h2>Money</h2><div class="tiles">
    <div class="tile"><div class="k">${num(views)}</div><div class="l">TikTok views</div></div>
    <div class="tile"><div class="k">$${earned.toFixed(2)}</div><div class="l">earned so far</div></div>
    <div class="tile">${next ? `<div class="k">${Math.round(next.p.views / next.p.pays_from * 100)}%</div>
      <div class="l">to first payout</div><div class="bar"><i style="width:${Math.min(100, next.p.views / next.p.pays_from * 100).toFixed(1)}%"></i></div>`
      : `<div class="k">–</div><div class="l">next payout</div>`}</div></div>`;
}

function campRow(c){
  const q = UI.queueing === c.id;
  const rate = String(c.rate || "").split(" · ")[0];
  const cap = (c.money || {}).max_payout ? "max " + usd(c.money.max_payout) + "/post" : "";
  return `<div class="item" style="flex-wrap:wrap"><span class="main"><span class="t">${esc(c.short || c.name)}</span>
    <span class="s">${esc([rate, cap, c.rem != null ? usd(c.rem) + " left" : ""].filter(Boolean).join(" · "))}</span>
    ${!c.can_queue && !c.discovered ? `<span class="s">No new clips (small campaign)</span>` : ""}</span>
    ${c.can_queue ? (q ? "" : `<button class="btn small" data-queue="${esc(c.id)}">Make a clip</button>`) : ""}
    ${q ? `<div class="row" style="width:100%"><input type="text" data-text="q:${esc(c.id)}" maxlength="300" placeholder="Optional: which moment" value="${esc(UI.text["q:" + c.id] || "")}">
      <button class="btn" data-queueit="${esc(c.id)}">Queue it</button><button class="btn link" data-queuecancel="1">Cancel</button></div>` : ""}</div>`;
}
function renderCamps(){
  const cs = S.campaigns || [];
  const mine = cs.filter(c => !c.discovered && ["ok", "warn"].includes(c.flag));
  const finds = cs.filter(c => c.discovered && c.flag === "ok" && c.can_queue).sort((a, b) => ((b.money || {}).score || 0) - ((a.money || {}).score || 0));
  $("s-camps").innerHTML = `<h2>Campaigns</h2>
    <div class="list">${mine.length ? mine.map(campRow).join("") : `<div class="item"><span class="main muted">No active campaigns.</span></div>`}</div>
    ${finds.length ? `<details class="more"><summary>New campaigns found (${finds.length})</summary><div class="inner" style="padding:0">
      <div class="list">${finds.map(campRow).join("")}</div></div></details>` : ""}`;
}

function renderLater(){
  const lf = (S.youtube || {}).longform;
  if (!lf) { $("s-later").innerHTML = ""; return; }
  const ms = lf.milestones || [];
  const icon = {done: "✓", now: "→", todo: "·", goal: "★"};
  $("s-later").innerHTML = `<details class="more"><summary>Faceless YouTube channel (project)</summary><div class="inner">
    <p class="hint">${esc([lf.format, lf.voice].filter(Boolean).join(" · "))}. ${esc(lf.goal || "")}</p>
    <ol class="steps" style="list-style:none;padding:0">${ms.map(m => `<li>${icon[m.status] || "·"} ${esc(m.label)}${m.owner && m.owner !== "goal" ? ` <span class="hint">(${esc(m.owner)})</span>` : ""}</li>`).join("")}</ol>
  </div></details>`;
}

function render(){
  const a = document.activeElement;
  if (a && a.matches && a.matches("input") && document.body.contains(a)) { pendingRender = true; return; }
  pendingRender = false;
  const up = S.board.updated ? new Date(S.board.updated) : null;
  $("stamp").textContent = !db ? "Offline copy · open on claude.ai"
    : up && !isNaN(up) ? `Live · updated ${up.toLocaleString([], {weekday: "short", hour: "numeric", minute: "2-digit"})}` : "Live";
  renderNext(); renderClips(); renderMoney(); renderCamps(); renderLater();
}
document.addEventListener("focusout", () => setTimeout(() => { if (pendingRender) render(); }, 0));
setInterval(() => { if (!document.hidden) render(); }, 60000);  // TikTok form expiry

// ---------- live data ----------
(async () => { try { dls = await window.claude.use("downloads"); } catch (e) { dls = null; } if (dls) render(); })();
(async () => {
  try { db = await window.claude.use("db"); } catch (e) { db = null; }
  if (!db) { render(); return; }
  $("dot").classList.add("live");
  const list = (snap) => snap.docs.filter(d => d.exists).map(d => ({id: d.id, ...d.data()}));
  db.doc("meta/board").onSnapshot(s => { if (s.exists) { S.board = s.data(); render(); } }, e => console.warn(e));
  db.doc("meta/youtube").onSnapshot(s => { if (s.exists) { S.youtube = s.data(); render(); } }, e => console.warn(e));
  db.collection("campaigns").onSnapshot(s => { S.campaigns = list(s); render(); }, e => console.warn(e));
  db.collection("queue").onSnapshot(s => { S.queue = list(s); render(); }, e => console.warn(e));
  db.collection("posts").onSnapshot(s => { S.posts = list(s); render(); }, e => console.warn(e));
})();

// ---------- actions ----------
document.addEventListener("input", (ev) => { const k = ev.target && ev.target.dataset && ev.target.dataset.text; if (k) UI.text[k] = ev.target.value; });
document.addEventListener("toggle", (ev) => { if (ev.target.dataset && ev.target.dataset.fin) UI.finished = ev.target.open; }, true);

document.addEventListener("click", async (ev) => {
  const t = ev.target.closest("button"); if (!t) return;
  const d = t.dataset;
  const clipOf = (k) => S.queue.find(x => x.id === k.split(":")[0]);
  if (d.focus) { UI.focus = d.focus; render(); window.scrollTo({top: 0, behavior: "smooth"}); return; }
  if (d.skip) { UI.skipped.push(d.skip); UI.focus = null; return render(); }
  if (d.clip) {
    const s = allSteps().find(x => (x.q && x.q.id === d.clip) || (x.items && x.items.some(i => i.q.id === d.clip)));
    if (s) { UI.skipped = UI.skipped.filter(k => k !== s.key); UI.focus = s.key; render(); window.scrollTo({top: 0, behavior: "smooth"}); }
    else toast("Nothing left to do for this clip.");
    return;
  }
  if (d.copy) { const q = clipOf(d.copy); if (q) await copy(captionFor(q, d.copy.split(":")[1]), t); return; }
  if (d.copydesc) { const q = clipOf(d.copydesc); if (q) await copy(pk(q).yt_description || "", t); return; }
  if (d.copyname) { const q = clipOf(d.copyname); if (q) await copy(whopName(q), t); return; }
  if (d.copylink) { const q = clipOf(d.copylink); if (q) await copy(((q.platforms || {})[d.copylink.split(":")[1]] || {}).url || "", t); return; }
  if (d.dl) {
    const q = clipOf(d.dl); if (!q || !dls) return;
    const old = t.textContent;
    try {
      t.disabled = true; t.textContent = "Preparing…";
      const blob = await (await fetch(q.clip.asset_url)).blob();
      t.textContent = "Confirm the save";
      await dls.save({filename: q.clip.name || "clip.mp4", data: blob});
      toast("Saved to your device.");
    } catch (e) { if (!e || e.code !== "declined") toast("Couldn't save the video. Try again."); }
    finally { t.disabled = false; t.textContent = old; }
    return;
  }
  if (d.openpost) { UI.open[d.openpost] = true; render();
    const inp = document.querySelector(`[data-text="${CSS.escape(d.openpost)}"]`); if (inp) inp.focus(); return; }
  if (d.savepost) {
    const [id, p] = d.savepost.split(":");
    const url = (UI.text[d.savepost] || "").trim();
    if (url && !/^https?:\/\//i.test(url)) { toast("That doesn't look like a link. Paste the full post link."); return; }
    const ok = await write(() => qdoc(id).update({status: "posted", updated: Date.now(),
      platforms: {[p]: {status: "posted", url, at: Date.now()}}}), "Saved. Next: submit it on Whop.");
    if (ok) { delete UI.open[d.savepost]; delete UI.text[d.savepost]; UI.focus = null; render(); }
    return;
  }
  if (d.ytpublic) {
    const q = clipOf(d.ytpublic); if (!q) return;
    const yd = draftOf(q, "youtube") || {};
    const url = yd.shorts_url || (yd.youtube_id ? "https://youtube.com/shorts/" + yd.youtube_id : "");
    await write(() => qdoc(q.id).update({status: "posted", updated: Date.now(), drafts: {youtube: {status: "public"}},
      platforms: {youtube: {status: "posted", url, at: Date.now()}}}), "Nice. Next: submit it on Whop.");
    UI.focus = null; return render();
  }
  if (d.approval) {
    const [id, st] = d.approval.split(":");
    const extra = st === "rejected" ? {skip_submit: true, skip_reason: "Not approved by the campaign"} : {};
    await write(() => qdoc(id).update({updated: Date.now(), approval: {status: st, at: Date.now()}, ...extra}),
      st === "approved" ? "Approved. Now post it." : st === "pending" ? "Got it. Don't post until they approve it." : "OK, taken off your list.");
    UI.focus = null; return render();
  }
  if (d.okd) {
    await write(() => qdoc(d.okd).update({updated: Date.now(), drafts: {tiktok: {status: "in_inbox"}}}), "It's in your TikTok inbox now.");
    UI.focus = null; return render();
  }
  if (d.submitted) {
    const [id, p] = d.submitted.split(":");
    await write(() => qdoc(id).update({updated: Date.now(), platforms: {[p]: {status: "submitted", submitted_at: Date.now()}}}), "Submitted ✓");
    return;
  }
  if (d.done) {
    const tasks = (S.board.tasks || []).map(x => x.id === d.done ? {...x, done: true} : x);
    await write(() => db.doc("meta/board").update({tasks, updated: Date.now()}), "Crossed off.");
    UI.focus = null; return;
  }
  if (d.queue) { UI.queueing = d.queue; render(); const inp = document.querySelector(`[data-text="q:${CSS.escape(d.queue)}"]`); if (inp) inp.focus(); return; }
  if (d.queuecancel) { UI.queueing = null; return render(); }
  if (d.queueit) {
    const c = S.campaigns.find(x => x.id === d.queueit); if (!c) return;
    const note = (UI.text["q:" + c.id] || "").trim();
    const ok = await write(() => db.collection("queue").add({campaign_id: c.id, campaign_name: c.name, note, status: "queued",
      allowed: c.platforms || ["tiktok"], created: Date.now(), updated: Date.now()}), "Queued. The agent makes it within the hour.");
    if (ok) { UI.queueing = null; delete UI.text["q:" + c.id]; render(); }
    return;
  }
  if (d.cancel) {
    if (!UI.confirm[d.cancel]) { UI.confirm[d.cancel] = true; render();
      setTimeout(() => { delete UI.confirm[d.cancel]; render(); }, 3000); return; }
    delete UI.confirm[d.cancel];
    await write(() => qdoc(d.cancel).update({status: "killed", kill_reason: "cancelled from the board", updated: Date.now()}), "Cancelled.");
  }
});

render();
</script>
